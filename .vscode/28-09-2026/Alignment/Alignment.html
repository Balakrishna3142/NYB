<!DOCTYPE html>
<html>
<head>
    <title>CSS Alignment Examples</title>
    <link rel="stylesheet" href="./Alignment.css">
</head>
<body>

    <h1>CSS Alignment Examples</h1>

    <!-- Horizontal Alignment -->
    <section>
        <h2>1. Horizontal Alignment</h2>
        <div class="horizontal">
            <p>Text is horizontally centered</p>
        </div>
    </section>

    <!-- Vertical Alignment -->
    <section>
        <h2>2. Vertical Alignment</h2>
        <div class="vertical">
            <p>Text is vertically centered</p>
        </div>
    </section>

    <!-- Flex Alignment -->
    <section>
        <h2>3. Flex Alignment</h2>
        <div class="flex-container">
            <div>Box 1</div>
            <div>Box 2</div>
            <div>Box 3</div>
        </div>
    </section>

    <!-- Grid Alignment -->
    <section>
        <h2>4. Grid Alignment</h2>
        <div class="grid-container">
            <div>Box 1</div>
            <div>Box 2</div>
            <div>Box 3</div>
            <div>Box 4</div>
        </div>
    </section>

</body>
</html>
