<!DOCTYPE html>
<html>
<head>
    <title>CSS Position Examples</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- Static -->
    <div class="static">
        1. STATIC - Normal position
    </div>

    <!-- Relative -->
    <div class="relative">
        2. RELATIVE - Moved from normal position
    </div>

    <!-- Absolute -->
    <div class="parent">
        Parent
        <div class="absolute">
            3. ABSOLUTE
        </div>
    </div>

    <!-- Sticky -->
    <div class="sticky">
        5. STICKY - Scroll down!
    </div>

    <p>
        Scroll down to see Sticky and Fixed positioning.
    </p>

    <!-- Fixed -->
    <div class="fixed">
        4. FIXED - I stay here!
    </div>

</body>
</html>
