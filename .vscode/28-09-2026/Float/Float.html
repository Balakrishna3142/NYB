<!DOCTYPE html>
<html>
<head>
    <title>Float and Clear</title>
    <link rel="stylesheet" href="./Float.css">
</head>
<body>

    <h1>Float and Clear Example</h1>

    <div class="box1">Float Left</div>

    <div class="box2">Float Right</div>

    <p>
        This text flows around the floated boxes.
        Float is used to move elements to the left or right.
    </p>

    <div class="clear-box">
        Clear Both - This comes below the floated boxes.
    </div>

</body>
</html>
