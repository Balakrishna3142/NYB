<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <link rel="stylesheet" href="selectors.css">
</head>

<body>

    <h1>Different CSS Selectors</h1>

    <!-- Element Selector -->
    <p>This is an element selector.</p>

    <!-- ID Selector -->
    <p id="para1">This is an ID selector.</p>

    <!-- Class Selector -->
    <p class="text">This is a class selector.</p>

    <!-- Universal Selector -->
    <div>
        Universal selector applies to all elements.
    </div>

    <!-- Group Selector -->
    <h2>Group Selector Heading</h2>
    <h3>Group Selector Subheading</h3>

    <!-- Descendant Selector -->
    <div class="box">
        <p>This is a descendant selector.</p>
    </div>

    <!-- Child Selector -->
    <div class="parent">
        <p>This is a direct child.</p>
    </div>

</body>
</html>
