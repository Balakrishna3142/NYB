
<!DOCTYPE html>
<html>
<head>
    <title>CSS Pseudo-Elements</title>
    <link rel="stylesheet" href="./Pseudo.css">
</head>

<body>

    <h2>CSS Pseudo-Elements</h2>

    <p class="before">This is an example of before.</p>

    <p class="after">This is an example of after.</p>

    <p class="letter">
        This paragraph demonstrates the first letter pseudo-element.
    </p>

    <p class="line">
        This paragraph demonstrates the first line pseudo-element.
        The remaining text will not have the same style.
    </p>

</body>
</html>
