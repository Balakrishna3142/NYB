<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Example</title>
    <link rel="stylesheet" href="./Gride.css">
</head>

<body>

    <h1>CSS Grid Layout</h1>

    <!-- Grid Container -->
    <div class="grid-container">

        <!-- Grid Areas -->
        <header>Header</header>

        <nav>Navigation</nav>

        <main>
            <h2>Main Content</h2>

            <!-- Nested Grid -->
            <div class="nested-grid">
                <div>Box 1</div>
                <div>Box 2</div>
                <div>Box 3</div>
                <div>Box 4</div>
            </div>
        </main>

        <aside>Sidebar</aside>

        <footer>Footer</footer>

    </div>


    <!-- Flexbox vs Grid -->
    <h2>Flexbox Example</h2>

    <div class="flex-container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>

</body>
</html>
