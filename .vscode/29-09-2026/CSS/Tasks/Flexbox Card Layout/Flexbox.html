<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Card Layout</title>
    <link rel="stylesheet" href="./Flexbox.css">
</head>

<body>

    <h1>Our Courses</h1>

    <div class="card-container">

        <!-- Card 1 -->
        <div class="card">
            <div class="card-image">HTML</div>

            <div class="card-content">
                <h2>HTML Course</h2>
                <p>
                    Learn how to create the structure of modern
                    web pages using HTML.
                </p>

                <button>Learn More</button>
            </div>
        </div>


        <!-- Card 2 -->
        <div class="card">
            <div class="card-image">CSS</div>

            <div class="card-content">
                <h2>CSS Course</h2>
                <p>
                    Learn how to style websites using colors,
                    layouts, Flexbox and Grid.
                </p>

                <button>Learn More</button>
            </div>
        </div>


        <!-- Card 3 -->
        <div class="card">
            <div class="card-image">JS</div>

            <div class="card-content">
                <h2>JavaScript Course</h2>
                <p>
                    Learn JavaScript to create interactive
                    and dynamic websites.
                </p>

                <button>Learn More</button>
            </div>
        </div>

    </div>

</body>
</html>
