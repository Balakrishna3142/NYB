<!DOCTYPE html>
<html>
<head>
    <title>CSS Practical Task</title>
    <link rel="stylesheet" href="./Task.css">
</head>
<body>

    <header>
        <h1>My College Website</h1>
        <p>Welcome to our college</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <main>

        <!-- Typography, Colors, Spacing -->
        <section>
            <h2>About Us</h2>
            <p>
                Our college provides quality education and helps
                students develop their skills.
            </p>
        </section>

        <!-- Table Styling -->
        <section>
            <h2>Student Details</h2>

            <table>
                <tr>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Marks</th>
                </tr>

                <tr>
                    <td>Ravi</td>
                    <td>BCA</td>
                    <td>85</td>
                </tr>

                <tr>
                    <td>Sita</td>
                    <td>B.Sc</td>
                    <td>90</td>
                </tr>
            </table>
        </section>

        <!-- Form Styling -->
        <section>
            <h2>Registration Form</h2>

            <form>
                <label>Name:</label>
                <input type="text" placeholder="Enter your name">

                <label>Email:</label>
                <input type="email" placeholder="Enter your email">

                <label>Course:</label>
                <select>
                    <option>BCA</option>
                    <option>B.Sc</option>
                    <option>B.Com</option>
                </select>

                <button type="submit">Register</button>
            </form>
        </section>

    </main>

    <footer>
        <p>© 2026 My College</p>
    </footer>

</body>
</html>
