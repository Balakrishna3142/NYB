
<!DOCTYPE html>
<html>
<head>
    <title>Product Management App</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
            background: #f4f4f4;
        }

        h2 {
            text-align: center;
        }

        input, select, textarea, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            cursor: pointer;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
        }

        .product {
            background: white;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            width: 230px;
            display: inline-block;
            vertical-align: top;
        }

        .product img {
            width: 100%;
            height: 130px;
            object-fit: contain;
        }

        .product button {
            margin: 3px;
        }

        #productForm, #details {
            background: white;
            padding: 15px;
            margin: 15px 5px;
            border-radius: 8px;
        }

        #error {
            color: red;
        }

        #loading {
            color: blue;
        }

        .danger {
            background: #dc2626;
        }

        .secondary {
            background: #64748b;
        }
    </style>
</head>

<body>

    <h2>API-Based Product Management</h2>

    <!-- Search -->
    <input
        type="text"
        id="search"
        placeholder="Search products..."
    >

    <!-- Filter -->
    <select id="category">
        <option value="">All Categories</option>
    </select>

    <button id="addBtn">Add Product</button>

    <!-- Loading -->
    <p id="loading"></p>

    <!-- Error -->
    <p id="error"></p>

    <!-- Product Form -->
    <form id="productForm" hidden>

        <h3 id="formTitle">Add Product</h3>

        <input
            type="text"
            id="title"
            placeholder="Product Name"
            required
        >

        <input
            type="number"
            id="price"
            placeholder="Price"
            min="0.01"
            step="0.01"
            required
        >

        <input
            type="text"
            id="productCategory"
            placeholder="Category"
            required
        >

        <textarea
            id="description"
            placeholder="Product Description"
            required
        ></textarea>

        <br>

        <button type="submit">Save Product</button>

        <button type="button" id="cancelBtn"
            class="secondary">
            Cancel
        </button>

    </form>

    <!-- Product Details -->
    <div id="details" hidden></div>

    <!-- Product List -->
    <h3>Product List</h3>

    <div id="productList"></div>

    <script src="./Mini.js"></script>

</body>
</html>
