
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f2f6fc;
        }

        h1 {
            text-align: center;
            color: #234;
        }

        .container {
            max-width: 850px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        input {
            width: 100%;
        }

        button {
            background-color: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0d4777;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #1769aa;
            color: white;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Student Result Management System</h1>

        <h3>Enter Student Details</h3>

        <form id="studentForm">
            <label>Student Name:</label>
            <input type="text" id="name" placeholder="Enter student name" required>

            <label>Roll Number:</label>
            <input type="text" id="roll" placeholder="Enter roll number" required>

            <label>Subject 1 Marks:</label>
            <input type="number" id="m1" min="0" max="100" required>

            <label>Subject 2 Marks:</label>
            <input type="number" id="m2" min="0" max="100" required>

            <label>Subject 3 Marks:</label>
            <input type="number" id="m3" min="0" max="100" required>

            <label>Subject 4 Marks:</label>
            <input type="number" id="m4" min="0" max="100" required>

            <label>Subject 5 Marks:</label>
            <input type="number" id="m5" min="0" max="100" required>

            <button type="submit">Calculate Result</button>
        </form>

        <h3>Student Results</h3>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Total</th>
                    <th>Percentage</th>
                    <th>Grade</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="resultTable"></tbody>
        </table>
    </div>

    <script src="./Mini.js"></script>
</body>
</html>
