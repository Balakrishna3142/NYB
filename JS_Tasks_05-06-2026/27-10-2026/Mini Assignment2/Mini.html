
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Data Processing Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1, h2 {
            color: #243b64;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            background: #243b64;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #4169a1;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .stat-card {
            padding: 15px;
            background: #edf3ff;
            border-radius: 8px;
        }

        .stat-card p {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #243b64;
            color: white;
        }

        #message {
            color: #c0392b;
            margin: 10px 0;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Employee Data Processing Application</h1>
    <p>Manage, search, filter and analyze employee information.</p>

    <h2>Search Employee by ID</h2>
    <div class="controls">
        <input type="number" id="employeeId"
               placeholder="Enter employee ID">
        <button onclick="searchEmployee()">Search</button>
        <button onclick="resetView()">Show All</button>
    </div>

    <h2>Filter by Department</h2>
    <div class="controls">
        <select id="department" onchange="filterEmployees()">
            <option value="All">All Departments</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
        </select>

        <button onclick="sortBySalary('asc')">
            Salary: Low to High
        </button>

        <button onclick="sortBySalary('desc')">
            Salary: High to Low
        </button>
    </div>

    <h2>Salary Summary</h2>
    <div class="stats">
        <div class="stat-card">
            Total Employees
            <p id="totalEmployees">0</p>
        </div>

        <div class="stat-card">
            Total Salary
            <p id="totalSalary">₹0</p>
        </div>

        <div class="stat-card">
            Average Salary
            <p id="averageSalary">₹0</p>
        </div>

        <div class="stat-card">
            Highest Salary
            <p id="highestSalary">₹0</p>
        </div>

        <div class="stat-card">
            Lowest Salary
            <p id="lowestSalary">₹0</p>
        </div>
    </div>

    <h2>Employee List</h2>
    <p id="message"></p>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Age</th>
                    <th>Salary</th>
                </tr>
            </thead>

            <tbody id="employeeTable"></tbody>
        </table>
    </div>

</div>

<script src="./Mini.js"></script>
</body>
</html>
