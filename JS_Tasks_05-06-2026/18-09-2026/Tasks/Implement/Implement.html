<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Events</title>
</head>
<body>

<h2>JavaScript Event Demonstration</h2>

<!-- Input Event -->
<input type="text" id="name" placeholder="Enter your name">
<p id="inputOutput"></p>

<!-- Change Event -->
<select id="course">
    <option value="">Select Course</option>
    <option value="Java">Java</option>
    <option value="Python">Python</option>
    <option value="JavaScript">JavaScript</option>
</select>
<p id="changeOutput"></p>

<!-- Click Event -->
<button id="btn">Click Me</button>
<p id="clickOutput"></p>

<!-- Mouse Event -->
<div id="box"
     style="width:200px;height:100px;background-color:lightblue;
            margin-top:20px;text-align:center;padding-top:30px;">
    Move Mouse Here
</div>
<p id="mouseOutput"></p>

<!-- Keyboard Event -->
<input type="text" id="keyBox" placeholder="Press any key">
<p id="keyOutput"></p>

<!-- Submit Event -->
<form id="myForm">
    <input type="text" placeholder="Enter username" required>
    <button type="submit">Submit</button>
</form>
<p id="submitOutput"></p>


<script>

// 1. CLICK EVENT
document.getElementById("btn").addEventListener("click", function() {
    document.getElementById("clickOutput").innerHTML =
        "Button clicked!";
});


// 2. INPUT EVENT
document.getElementById("name").addEventListener("input", function() {
    document.getElementById("inputOutput").innerHTML =
        "You entered: " + this.value;
});


// 3. CHANGE EVENT
document.getElementById("course").addEventListener("change", function() {
    document.getElementById("changeOutput").innerHTML =
        "Selected course: " + this.value;
});


// 4. MOUSE EVENT
document.getElementById("box").addEventListener("mouseover", function() {
    document.getElementById("mouseOutput").innerHTML =
        "Mouse is over the box!";
});

document.getElementById("box").addEventListener("mouseout", function() {
    document.getElementById("mouseOutput").innerHTML =
        "Mouse left the box!";
});


// 5. KEYBOARD EVENT
document.getElementById("keyBox").addEventListener("keydown", function(event) {
    document.getElementById("keyOutput").innerHTML =
        "You pressed: " + event.key;
});


// 6. SUBMIT EVENT
document.getElementById("myForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("submitOutput").innerHTML =
        "Form submitted successfully!";
});

</script>

</body>
</html>
