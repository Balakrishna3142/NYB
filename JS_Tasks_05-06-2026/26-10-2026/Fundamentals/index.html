
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Learning Examples</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #1d4ed8;
    }

    button {
      padding: 10px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px 0;
    }

    pre {
      background: #0f172a;
      color: #86efac;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card {
      background: white;
      padding: 18px;
      margin: 15px 0;
      border-radius: 8px;
      box-shadow: 0 2px 6px #0001;
    }
  </style>
</head>
<body>

  <h1>JavaScript Learning Examples</h1>
  <p>Learn JavaScript variables, data types, operators,
     conditions, loops, scope and hoisting.</p>

  <div class="card">
    <h2>Run JavaScript Examples</h2>
    <button onclick="runExamples()">Run All Examples</button>
    <button onclick="clearOutput()">Clear Output</button>
    <pre id="output">Click "Run All Examples" to see results.</pre>
  </div>

  <script src="./script.js"></script>
</body>
</html>
