<!DOCTYPE html>
<html>
<head>
    <title>Browser Storage Example</title>
</head>
<body>
    <h2>Browser Storage Example</h2>

    <input type="text" id="name" placeholder="Enter Name">
    <input type="number" id="age" placeholder="Enter Age">

    <br><br>

    <button onclick="saveLocal()">Save to Local Storage</button>
    <button onclick="saveSession()">Save to Session Storage</button>
    <button onclick="showData()">Show Data</button>
    <button onclick="clearData()">Clear Storage</button>

    <h3>Output:</h3>
    <p id="output"></p>

    <script src="./Browser.js"></script>
</body>
</html>
