<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

<table border="1">

    <!-- Table Caption -->
    <caption>Student Marks</caption>

    <!-- Table Header -->
    <tr>
        <th>Name</th>
        <th>Subject</th>
        <th>Marks</th>
    </tr>

    <!-- Table Row + Rowspan -->
    <tr>
        <td rowspan="2">Balakrishna</td>
        <td>Maths</td>
        <td>90</td>
    </tr>

    <tr>
        <td>Science</td>
        <td>85</td>
    </tr>

    <!-- Colspan -->
    <tr>
        <td colspan="2">Total Marks</td>
        <td>175</td>
    </tr>

</table>

</body>
</html>
