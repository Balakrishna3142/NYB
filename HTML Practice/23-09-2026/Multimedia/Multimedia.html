<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Examples</title>
</head>
<body>

    <h1>HTML Multimedia Examples</h1>

    <!-- Audio -->
    <h2>Audio</h2>
    <audio controls>
        <source src="Original Vande Mataram (AnandMatha).mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Video -->
    <h2>Video</h2>
    <video width="500" controls>
        <source src="sample-5s.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

    <!-- Source -->
    <h2>Source</h2>
    <video width="500" controls>
        <source src="sample-5s.mp4" type="video/mp4">
        <source src="movie.webm" type="video/webm">
    </video>

    <!-- Controls -->
    <h2>Controls</h2>
    <audio controls>
        <source src="Original Vande Mataram (AnandMatha).mp3" type="audio/mpeg">
    </audio>

    <!-- Autoplay -->
    <h2>Autoplay</h2>
    <video width="500" autoplay muted>
        <source src="sample-5s.mp4" type="video/mp4">
    </video>

    <!-- Loop -->
    <h2>Loop</h2>
    <video width="500" controls loop>
        <source src="sample-5s.mp4" type="video/mp4">
    </video>

    <!-- Muted -->
    <h2>Muted</h2>
    <video width="500" controls muted>
        <source src="sample-5s.mp4" type="video/mp4">
    </video>

</body>
</html>
