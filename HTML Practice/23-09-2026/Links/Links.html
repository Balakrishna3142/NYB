<!DOCTYPE html>
<html>
<head>
    <title>HTML Links</title>
</head>
<body>

    <h1>Types of Links</h1>

    <!-- Anchor Tag -->
    <h2>1. Anchor Tag</h2>
    <a href="https://www.google.com">Visit Google</a>

    <!-- Internal Link -->
    <h2>2. Internal Link</h2>
    <a href="#contact">Go to Contact Section</a>

    <!-- External Link -->
    <h2>3. External Link</h2>
    <a href="https://www.wikipedia.org">Visit Wikipedia</a>

    <!-- Email Link -->
    <h2>4. Email Link</h2>
    <a href="mailto:example@gmail.com">Send Email</a>

    <!-- Telephone Link -->
    <h2>5. Telephone Link</h2>
    <a href="tel:+919876543210">Call Us</a>

    <!-- Opening Link in New Tab -->
    <h2>6. Open Link in New Tab</h2>
    <a href="https://www.youtube.com" target="_blank">
        Open YouTube in New Tab
    </a>

    <!-- Target for Internal Link -->
    <h2 id="contact">Contact Section</h2>
    <p>This is the contact section of the page.</p>

</body>
</html>
