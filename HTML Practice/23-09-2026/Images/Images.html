<!DOCTYPE html>
<html>
<head>
    <title>Image Examples</title>

    <!-- Favicon -->
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <h1>HTML Image Examples</h1>

    <!-- Image Tag + src + alt + width + height -->
    <img 
        src="download.jpg"
        alt="A cute cat"
        width="400"
        height="300"
    >

    <br><br>

    <!-- Image Link -->
    <a href="https://example.com">
        <img 
            src="logo.png"
            alt="Example logo"
            width="200"
        >
    </a>

</body>
</html>
