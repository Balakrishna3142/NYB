<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        fieldset {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        legend {
            font-weight: bold;
            color: #333;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        .gender label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Job Application Form</h1>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname"
                   placeholder="Enter your first name"
                   required>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname"
                   placeholder="Enter your last name"
                   required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label>Gender:</label>
            <div class="gender">
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="Female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="Other">
                <label for="other">Other</label>
            </div>
        </fieldset>


        <!-- Contact Details -->
        <fieldset>
            <legend>Contact Details</legend>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   placeholder="example@gmail.com"
                   required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter 10-digit phone number"
                   pattern="[0-9]{10}"
                   required>

            <label for="address">Address:</label>
            <textarea id="address" name="address"
                      rows="3"
                      placeholder="Enter your address"
                      required></textarea>

            <label for="location">Location:</label>
            <select id="location" name="location" required>
                <option value="">-- Select Location --</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Bangalore">Bangalore</option>
                <option value="Chennai">Chennai</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Delhi">Delhi</option>
            </select>
        </fieldset>


        <!-- Education -->
        <fieldset>
            <legend>Education</legend>

            <label for="qualification">Highest Qualification:</label>
            <select id="qualification" name="qualification" required>
                <option value="">-- Select Qualification --</option>
                <option value="10th">10th</option>
                <option value="12th">12th</option>
                <option value="Diploma">Diploma</option>
                <option value="B.Tech">B.Tech</option>
                <option value="B.Sc">B.Sc</option>
                <option value="B.Com">B.Com</option>
                <option value="M.Tech">M.Tech</option>
                <option value="MBA">MBA</option>
                <option value="MCA">MCA</option>
            </select>

            <label for="college">College / University:</label>
            <input type="text" id="college" name="college"
                   placeholder="Enter college/university"
                   required>

            <label for="year">Year of Passing:</label>
            <input type="number" id="year" name="year"
                   min="1950"
                   max="2026"
                   placeholder="2025"
                   required>
        </fieldset>


        <!-- Skills -->
        <fieldset>
            <legend>Skills</legend>

            <label for="skills">Technical Skills:</label>
            <textarea id="skills" name="skills"
                      rows="4"
                      placeholder="Example: HTML, CSS, JavaScript, Python"
                      required></textarea>
        </fieldset>


        <!-- Experience -->
        <fieldset>
            <legend>Experience</legend>

            <label for="experience">Work Experience:</label>
            <select id="experience" name="experience" required>
                <option value="">-- Select Experience --</option>
                <option value="Fresher">Fresher</option>
                <option value="0-1">0 - 1 Year</option>
                <option value="1-3">1 - 3 Years</option>
                <option value="3-5">3 - 5 Years</option>
                <option value="5+">5+ Years</option>
            </select>

            <label for="company">Previous Company:</label>
            <input type="text" id="company" name="company"
                   placeholder="Enter previous company">

            <label for="jobdescription">Job Description:</label>
            <textarea id="jobdescription" name="jobdescription"
                      rows="4"
                      placeholder="Describe your previous work experience"></textarea>
        </fieldset>


        <!-- Resume Upload -->
        <fieldset>
            <legend>Resume Upload</legend>

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume"
                   accept=".pdf,.doc,.docx"
                   required>
        </fieldset>


        <!-- Terms and Conditions -->
        <fieldset>
            <legend>Terms and Conditions</legend>

            <input type="checkbox" id="terms" name="terms" required>

            <label for="terms" style="display:inline; font-weight:normal;">
                I agree to the Terms and Conditions.
            </label>
        </fieldset>


        <!-- Submit -->
        <button type="submit">Submit Application</button>

    </form>

</div>

</body>
</html>
