<!DOCTYPE html>
<html>

<head>
    <title>Block and Inline Elements</title>
</head>

<body>

    <h2>Block-Level Elements</h2>

    <div>This is a block-level element.</div>
    <p>This is a paragraph.</p>

    <h2>Inline Elements</h2>

    <p>
        This is <b>bold</b> text and this is
        <i>italic</i> text.
    </p>

</body>

</html>
